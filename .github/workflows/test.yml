name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: pytest (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 has full wheel coverage for scikit-learn 1.5.x + numpy 2.1.x
          # on Linux; 3.13 needs sklearn ≥1.6 wheels which came later. Local
          # dev + Render deploy still use 3.13 (runtime.txt).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest -q
